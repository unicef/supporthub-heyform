# Builds the SupportHub heyform fork and publishes it to the UNICEF ACR and to
# Jozian's registry (prod pulls from the latter).
#
# Exists because the dev deployment (supporthub_ops PR #95) pins
# `unicrsdsupporthub.azurecr.io/supporthub-heyform`, and nothing was publishing
# that repository — the only CI here is upstream's GitHub Actions, which push
# to upstream registries. Mirrors `unicef/supporthub`'s azure-pipelines.yml so
# the two behave the same; no Sentry build-arg/secret, which is app-specific.
#
# The image builds from the repo root with the default Dockerfile and no build
# args, matching both this repo's docker-compose.supporthub-spike.yml and the
# compose recipe in supporthub-v2's docker-compose.full.yaml
# (`build: { context: repos/heyform }`).
#
# Pin deploys to the immutable `$(Build.SourceVersion)` tag.
trigger:
  branches:
    include:
      - "supporthub-fork"
  tags:
    include:
      - "*"

pool:
  vmImage: ubuntu-latest

steps:
  - bash: |
      PR_NUM=$(System.PullRequest.PullRequestNumber)
      if [[ -n "${PR_NUM}" ]]
      then
        echo "Pull request ${PR_NUM}"
        echo "##vso[task.setvariable variable=dockerTag]pr-${PR_NUM}"
      else
        echo "Branch or tag $(Build.SourceBranchName)"
        echo "##vso[task.setvariable variable=dockerTag]$(Build.SourceBranchName)"
      fi
    displayName: Generate docker tag name
    name: TagName
  - task: Docker@2
    displayName: Build supporthub-heyform image
    inputs:
      containerRegistry: "unicrsdsupporthub"
      repository: "supporthub-heyform"
      command: "build"
      Dockerfile: "Dockerfile"
      buildContext: "$(Build.SourcesDirectory)"
      tags: "$(dockerTag),$(Build.SourceVersion),$(Build.SourceBranchName)_$(Build.SourceVersion)_$(Build.BuildNumber)"
  - task: Docker@2
    displayName: push supporthub-heyform image to container registry
    inputs:
      containerRegistry: "unicrsdsupporthub"
      repository: "supporthub-heyform"
      command: "push"
      tags: "$(dockerTag),$(Build.SourceVersion),$(Build.SourceBranchName)_$(Build.SourceVersion)_$(Build.BuildNumber)"
  # Prod (supporthub_ops k8s/overlays/k3s-supporthub.global) pulls only from
  # Jozian's registry, so the same image goes there too (supporthub_ops#111),
  # as unicef/supporthub does (#464). Re-tagged, not rebuilt: what prod runs is
  # byte-identical to what dev was verified on. Pull-request builds stay out of
  # the prod registry.
  - bash: |
      set -euo pipefail
      for tag in "$(dockerTag)" "$(Build.SourceVersion)" "$(Build.SourceBranchName)_$(Build.SourceVersion)_$(Build.BuildNumber)"; do
        docker tag "unicrsdsupporthub.azurecr.io/supporthub-heyform:${tag}" "supporthubjoz.azurecr.io/supporthub-heyform:${tag}"
      done
    displayName: Tag supporthub-heyform image for the Jozian registry
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  - task: Docker@2
    displayName: push supporthub-heyform image to the Jozian registry
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      containerRegistry: "supporthubjoz-acr"
      repository: "supporthub-heyform"
      command: "push"
      tags: "$(dockerTag),$(Build.SourceVersion),$(Build.SourceBranchName)_$(Build.SourceVersion)_$(Build.BuildNumber)"
